<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 💌</title>
  
  <!-- 引入可愛風格 Google 字體 (Mali & Noto Sans TC) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. 全局樣式與主題配色設定 (可在這裡調整顏色與字體)
       ========================================================= */
    :root {
      /* 主題色彩設定 */
      --bg-color: #fff5f7;           /* 全局背景色：柔和淡粉紅 */
      --card-bg: #ffffff;           /* 卡片背景色：純白 */
      --primary-color: #ff8fa3;      /* 主色調：草莓粉 */
      --secondary-color: #ffb3c6;    /* 次要色：淺粉紅 */
      --accent-color: #ff4d6d;       /* 強調色/亮起色：鮮艷櫻桃粉 */
      --text-color: #5c4d51;         /* 文字顏色：深暖棕色 */
      --light-text-color: #a39296;   /* 輔助文字：淡棕色 */
      
      /* 可愛馬卡龍邊框顏色庫 (動態隨機賦予卡片) */
      --tag-bg-1: #ffe5ec;
      --tag-bg-2: #e8f5e9;
      --tag-bg-3: #e3f2fd;
      --tag-bg-4: #fff3e0;
      --tag-bg-5: #f3e5f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Mali', 'Noto Sans TC', sans-serif;
      color: var(--text-color);
      padding: 30px 20px;
      min-height: 100vh;
      /* 背景可愛小波點圖案 */
      background-image: radial-gradient(#ffccd5 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 頁面標題區 */
    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header h1 {
      font-size: 2.3rem;
      color: var(--accent-color);
      margin-bottom: 8px;
      text-shadow: 2px 2px 0px #ffffff;
      display: inline-block;
    }

    header p {
      font-size: 1.05rem;
      color: var(--light-text-color);
    }

    /* =========================================================
       2. 酷炫可愛載入中動畫 (Loading Animation)
       ========================================================= */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
    }

    .loader-heart {
      display: inline-block;
      position: relative;
      width: 60px;
      height: 60px;
      transform: rotate(45deg);
      transform-origin: 30px 30px;
      animation: heart-beat 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    .loader-heart div {
      top: 20px;
      left: 20px;
      position: absolute;
      width: 26px;
      height: 26px;
      background: var(--primary-color);
    }

    .loader-heart div:after,
    .loader-heart div:before {
      content: " ";
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--primary-color);
    }

    .loader-heart div:before {
      top: -15px;
      left: 0;
    }

    .loader-heart div:after {
      left: -15px;
      top: 0;
    }

    @keyframes heart-beat {
      0% { transform: scale(0.95) rotate(45deg); }
      5% { transform: scale(1.1) rotate(45deg); }
      39% { transform: scale(0.85) rotate(45deg); }
      45% { transform: scale(1) rotate(45deg); }
      60% { transform: scale(0.95) rotate(45deg); }
      100% { transform: scale(0.9) rotate(45deg); }
    }

    .loading-text {
      margin-top: 25px;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary-color);
      letter-spacing: 1px;
    }

    /* =========================================================
       3. 瀑布流排版 (Masonry Layout)
       ========================================================= */
    .wall-grid {
      /* 利用 CSS Columns 實現真正的瀑布流 */
      column-count: 4;          /* 預設大螢幕顯示 4 欄 */
      column-gap: 20px;         /* 欄與欄之間的間距 */
      display: none;            /* 載入完成前先隱藏 */
    }

    /* 響應式欄位調整 */
    @media (max-width: 1024px) { .wall-grid { column-count: 3; } }
    @media (max-width: 768px)  { .wall-grid { column-count: 2; } }
    @media (max-width: 480px)  { .wall-grid { column-count: 1; } }

    /* =========================================================
       4. 留言卡片樣式與動態輪播特效 (Highlight Effects)
       ========================================================= */
    .card {
      background-color: var(--card-bg);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      break-inside: avoid;      /* 防止卡片被瀑布流截斷 */
      box-shadow: 0 8px 18px rgba(255, 182, 193, 0.2);
      border: 3px solid #fff;
      position: relative;
      /* 轉場動畫，使輪播放大/變暗變順暢 */
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
    }

    .card::before {
      content: '💌';
      position: absolute;
      top: 12px;
      right: 15px;
      font-size: 1.2rem;
      opacity: 0.6;
    }

    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--secondary-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .author-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-color);
    }

    .time-stamp {
      font-size: 0.75rem;
      color: var(--light-text-color);
      margin-top: 2px;
    }

    .card-body {
      font-size: 0.98rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap; /* 保留留言換行格式 */
    }

    /* ---------------------------------------------------------
       ★ 重點：輪播特效 CSS 狀態設定
       --------------------------------------------------------- */
    /* 1. 當前選中的亮起卡片 (Highlight) */
    .card.highlight {
      transform: scale(1.08);                             /* 卡片放大 */
      z-index: 10;                                       /* 浮在上層 */
      border-color: var(--accent-color) !important;      /* 顯眼的櫻桃粉邊框 */
      box-shadow: 0 12px 28px rgba(255, 77, 109, 0.4),   /* 粉紅發光陰影 */
                  0 0 0 4px rgba(255, 143, 163, 0.3);
      filter: brightness(1.05) contrast(1.05);           /* 提升亮度 */
    }

    /* 2. 其他未選中的卡片 (Dimmed) */
    .wall-grid.has-active .card:not(.highlight) {
      opacity: 0.5;                                      /* 降低透明度 */
      filter: blur(1px) grayscale(20%);                 /* 微幅模糊與降低飽和度 */
      transform: scale(0.96);                            /* 稍微微縮 */
    }

    /* 滑鼠懸停時允許使用者手動查看 */
    .card:hover {
      opacity: 1 !important;
      filter: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 頁面標題區 -->
    <header>
      <h1>✨ 朋友對我的動態留言牆 ✨</h1>
      <p>來自大家的溫馨留言與悄悄話 💖</p>
    </header>

    <!-- 載入中動畫區塊 -->
    <div id="loading-container">
      <div class="loader-heart"><div></div></div>
      <div class="loading-text">讀取留言中...</div>
    </div>

    <!-- 瀑布流留言牆容器 -->
    <main id="wall-grid" class="wall-grid"></main>
  </div>

  <script>
    // =========================================================
    // 參數設定區 (可依個人喜好修改)
    // =========================================================
    
    // 1. Google 試算表 CSV 發布網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRTtio4ocdKFVMMRfP3mg4B3JNpuaS8X7a61VQZkCTl9-wKgbl6pfEkIpF9e1ikMu_IADipi1Qg6GWf/pub?output=csv';
    
    // 2. ★ 輪播切換秒數設定 (單位：毫秒，3000ms = 3秒)
    const CAROUSEL_INTERVAL_MS = 3000;

    // 可愛的隨機馬卡龍邊框色系池
    const borderColors = [
      '#ffb3c6', '#b5e2fa', '#c5edd6', '#fed9b7', '#e8ae53', '#d8bbff'
    ];

    // 全局變數定義
    let messagesData = [];      // 存放解析後的留言陣列
    let currentHighlightIndex = -1; // 當前高亮卡片的索引
    let carouselTimer = null;   // 計時器物件

    // =========================================================
    // 頁面初始化與 CSV 資料讀取 (fetch)
    // =========================================================
    document.addEventListener('DOMContentLoaded', () => {
      fetchMessages();
    });

    /**
     * 從 Google 試算表擷取 CSV 資料
     */
    async function fetchMessages() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路回應不成功');
        
        const csvText = await response.text();
        // 解析 CSV 內容
        messagesData = parseCSV(csvText);

        // 隱藏 Loading 動畫，顯示留言牆
        document.getElementById('loading-container').style.display = 'none';
        const grid = document.getElementById('wall-grid');
        grid.style.display = 'block';

        if (messagesData.length === 0) {
          grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">目前還沒有任何留言喔！</p>';
          return;
        }

        // 動態渲染卡片到畫面上
        renderCards(messagesData);

        // 啟動自動輪播亮起特效
        startCarousel();

      } catch (error) {
        console.error('讀取 CSV 資料失敗：', error);
        document.getElementById('loading-container').innerHTML = `
          <p style="color: #ff4d6d; font-weight: bold;">載入留言失敗，請稍後再試！</p>
        `;
      }
    }

    // =========================================================
    // CSV 解析邏輯 (安全處理內容中的逗號與雙引號)
    // =========================================================
    /**
     * 專用 CSV 解析器
     * 欄位順序預設：[0]時間戳記, [1]名字, [2]悄悄話
     */
    function parseCSV(text) {
      const lines = text.split(/\r\n|\n/);
      const result = [];

      // 從第 1 行開始解析 (跳過第 0 行標頭 Header)
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        // 使用正規表達式匹配逗號分隔，同時忽略雙引號內的逗號
        const row = [];
        let insideQuotes = false;
        let entry = '';

        for (let j = 0; j < line.length; j++) {
          const char = line[j];
          if (char === '"') {
            insideQuotes = !insideQuotes; // 切換引號狀態
          } else if (char === ',' && !insideQuotes) {
            row.push(entry.trim());
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim());

        // 清理資料格式 (去除外層引號與重複的雙引號)
        const cleanRow = row.map(val => val.replace(/^"|"$/g, '').replace(/""/g, '"'));

        if (cleanRow.length >= 3) {
          result.push({
            timestamp: cleanRow[0] || '未知時間',
            name: cleanRow[1] || '神秘朋友',
            content: cleanRow[2] || '（這條留言沒有內容喔）'
          });
        }
      }
      return result;
    }

    // =========================================================
    // 動態生成 HTML 留言卡片
    // =========================================================
    function renderCards(data) {
      const grid = document.getElementById('wall-grid');
      grid.innerHTML = '';

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index;

        // 為每張卡片隨機給予一個可愛顏色邊框
        const randomColor = borderColors[index % borderColors.length];
        card.style.borderColor = randomColor;

        // 取得名字的第一個字做為頭像內容
        const firstLetter = item.name.trim().charAt(0).toUpperCase();

        card.innerHTML = `
          <div class="card-header">
            <div class="avatar" style="background-color: ${randomColor}">${firstLetter}</div>
            <div>
              <div class="author-name">${escapeHTML(item.name)}</div>
              <div class="time-stamp">${escapeHTML(item.timestamp)}</div>
            </div>
          </div>
          <div class="card-body">${escapeHTML(item.content)}</div>
        `;

        // 手動點擊卡片時，也可以切換聚焦該卡片
        card.addEventListener('click', () => {
          highlightCard(index);
          resetTimer(); // 重置 3 秒計時
        });

        grid.appendChild(card);
      });
    }

    // 防範 XSS 攻擊的字元轉義函式
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // =========================================================
    // 隨時間輪播亮起特效 (Focus Carousel)
    // =========================================================
    
    /**
     * 高亮指定索引的留言卡片
     */
    function highlightCard(index) {
      const cards = document.querySelectorAll('.card');
      const grid = document.getElementById('wall-grid');

      if (cards.length === 0) return;

      // 1. 移除先前卡片的高亮樣式
      cards.forEach(card => card.classList.remove('highlight'));

      // 2. 更新當前高亮索引
      currentHighlightIndex = index;
      const targetCard = cards[currentHighlightIndex];

      // 3. 賦予目標卡片 highlight 類別
      if (targetCard) {
        grid.classList.add('has-active'); // 標記牆面已有卡片高亮，藉此讓其他卡片變暗
        targetCard.classList.add('highlight');

        // 平滑滾動讓當前聚焦卡片儘量呈現在視窗可見區域
        targetCard.scrollIntoView({
          behavior: 'smooth',
          block: 'nearest'
        });
      }
    }

    /**
     * 依序切換下一張卡片高亮
     */
    function nextCard() {
      if (messagesData.length === 0) return;
      const nextIndex = (currentHighlightIndex + 1) % messagesData.length;
      highlightCard(nextIndex);
    }

    /**
     * 啟動輪播計時器
     */
    function startCarousel() {
      // 頁面剛載入時先亮起第 0 張卡片
      highlightCard(0);
      
      // 設定每隔 CAROUSEL_INTERVAL_MS (3秒) 自動執行 nextCard()
      carouselTimer = setInterval(nextCard, CAROUSEL_INTERVAL_MS);
    }

    /**
     * 重置計時器 (使用者手動點擊卡片時觸發)
     */
    function resetTimer() {
      if (carouselTimer) {
        clearInterval(carouselTimer);
        carouselTimer = setInterval(nextCard, CAROUSEL_INTERVAL_MS);
      }
    }
  </script>
</body>
</html>
