<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎀 雲端心電感應 - 美樂蒂默契大考驗 🎀</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: 圓潤可愛字體 -->
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4e9 50%, #ffd1dc 100%);
    }

    /* 3D 翻牌動畫相關 CSS */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="min-h-screen text-gray-700 flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header class="bg-white/80 backdrop-blur-md border-b-4 border-pink-200 sticky top-0 z-40 px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <!-- 標題與隱藏房主開關觸發器 (連續點擊圖示 3 次觸發) -->
      <div class="flex items-center gap-2 cursor-pointer select-none" onclick="handleSecretClick()">
        <span class="text-3xl animate-bounce">🎀</span>
        <h1 class="text-xl md:text-2xl font-extrabold text-pink-500 tracking-wide">心電感應 <span class="text-xs bg-pink-100 text-pink-600 px-2 py-0.5 rounded-full border border-pink-300">美樂蒂版</span></h1>
      </div>

      <!-- 房間與玩家資訊條 -->
      <div id="userInfoBar" class="hidden flex items-center gap-2 text-sm">
        <span id="displayRoom" class="bg-pink-100 text-pink-700 px-3 py-1 rounded-full font-bold border border-pink-300 shadow-sm"></span>
        <span id="displayName" class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full font-bold border border-yellow-300 shadow-sm"></span>
        
        <!-- 隱藏房主控制台開關按鈕 (幽靈風格) -->
        <button id="toggleHostBtn" onclick="toggleHostMode()" class="opacity-20 hover:opacity-100 transition-opacity bg-pink-500 text-white p-1 rounded-full text-xs" title="切換房主權限">
          👑
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full p-4 flex-grow">
    
    <!-- Step 1: 登入 / 選擇房間頁面 -->
    <section id="loginScreen" class="max-w-md mx-auto my-8 bg-white/90 rounded-3xl p-6 md:p-8 border-4 border-pink-200 shadow-xl text-center relative overflow-hidden">
      <div class="absolute -right-6 -top-6 text-7xl opacity-20 select-none">🐰</div>
      
      <h2 class="text-2xl font-bold text-pink-600 mb-2">✨ 進入心電感應房間 ✨</h2>
      <p class="text-xs text-pink-400 mb-6">輸入相同的房號即可與朋友進行多人默契挑戰！</p>
      
      <div class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-bold text-pink-500 mb-1 ml-1">遊戲房號 (Room Code)</label>
          <input type="text" id="inputRoom" placeholder="例如: 8888" value="8888" class="w-full px-4 py-3 rounded-2xl border-2 border-pink-200 focus:border-pink-400 focus:outline-none font-bold text-pink-600 bg-pink-50/50">
        </div>

        <div>
          <label class="block text-xs font-bold text-pink-500 mb-1 ml-1">你的暱稱 (Player Name)</label>
          <input type="text" id="inputName" placeholder="例如: 美樂蒂" class="w-full px-4 py-3 rounded-2xl border-2 border-pink-200 focus:border-pink-400 focus:outline-none font-bold text-pink-600 bg-pink-50/50">
        </div>

        <div class="flex items-center gap-2 pt-2">
          <input type="checkbox" id="isHostCheckbox" class="w-4 h-4 text-pink-500 rounded border-pink-300 focus:ring-pink-400">
          <label for="isHostCheckbox" class="text-xs text-gray-600 font-bold cursor-pointer">我是房主 (開啟主持功能)</label>
        </div>

        <button onclick="joinRoom()" class="w-full mt-4 py-3.5 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-extrabold rounded-2xl shadow-lg shadow-pink-200 hover:shadow-pink-300 transition-all text-lg tracking-wider">
          開始遊戲 🚀
        </button>
      </div>
    </section>

    <!-- Step 2: 主遊戲畫面 -->
    <section id="gameScreen" class="hidden space-y-6">

      <!-- 👑 房主控制台 (預設根據身份隱藏/顯示) -->
      <div id="hostConsole" class="hidden bg-gradient-to-r from-pink-100 to-rose-100 border-4 border-pink-300 rounded-3xl p-5 shadow-lg relative">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-bold text-pink-700 flex items-center gap-1">
            <span>👑 房主控制台</span>
            <span class="text-xs bg-pink-200 text-pink-800 px-2 py-0.5 rounded-full">隱藏功能選單</span>
          </h3>
          <span class="text-xs text-pink-500">目前房間: <b id="hostRoomLabel"></b></span>
        </div>

        <!-- 房主出題表單 -->
        <div class="flex flex-col sm:flex-row gap-2 mb-3">
          <input type="text" id="hostQuestionInput" placeholder="請在此輸入默契題目 (例：提到夏天會想到什麼？)" class="flex-grow px-4 py-2.5 rounded-xl border-2 border-pink-300 focus:outline-none text-sm font-bold">
          <button onclick="setQuestion()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold px-4 py-2.5 rounded-xl text-sm shadow transition">
            出題 📝
          </button>
        </div>

        <!-- 房主操作按鈕列 -->
        <div class="flex flex-wrap gap-2">
          <button onclick="revealCards()" class="flex-1 bg-gradient-to-r from-purple-400 to-pink-500 hover:from-purple-500 hover:to-pink-600 text-white font-bold py-2 px-4 rounded-xl text-sm shadow transition">
            🃏 揭曉答案 (開牌!)
          </button>
          <button onclick="resetGame()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-xl text-sm shadow transition">
            🔄 重置本局
          </button>
        </div>
      </div>

      <!-- 題目顯示區 -->
      <div class="bg-white/90 rounded-3xl p-6 border-4 border-pink-200 shadow-md text-center relative overflow-hidden">
        <div class="text-xs font-bold text-pink-400 mb-1 tracking-widest uppercase">CURRENT QUESTION</div>
        <h2 id="questionDisplay" class="text-2xl md:text-3xl font-extrabold text-pink-600">
          等待房主出題中... 💭
        </h2>
      </div>

      <!-- 玩家填答區 (發布題目後顯示) -->
      <div id="answerSection" class="hidden bg-white/90 rounded-3xl p-6 border-4 border-pink-200 shadow-md text-center">
        <h3 class="text-sm font-bold text-pink-500 mb-3">請寫下你的心電感應答案：</h3>
        <div class="flex max-w-md mx-auto gap-2">
          <input type="text" id="playerAnswerInput" placeholder="輸入你的答案..." class="flex-grow px-4 py-3 rounded-2xl border-2 border-pink-200 focus:border-pink-400 focus:outline-none font-bold text-pink-700 bg-pink-50/30">
          <button onclick="submitAnswer()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold px-6 py-3 rounded-2xl shadow transition">
            送出 💌
          </button>
        </div>
        <p id="submitStatus" class="text-xs text-pink-400 mt-2 h-4"></p>
      </div>

      <!-- 🃏 多人卡牌畫布 (3D 翻牌專區) -->
      <div>
        <div class="flex justify-between items-center mb-3 px-2">
          <h3 class="text-base font-bold text-pink-600 flex items-center gap-1">
            <span>🐾 玩家答案區</span>
            <span id="playerCountBadge" class="text-xs bg-pink-200 text-pink-700 px-2 py-0.5 rounded-full">0 人準備中</span>
          </h3>
          <span class="text-xs text-pink-400">狀態自動同步中...</span>
        </div>

        <!-- 3D 翻牌卡牌網格 -->
        <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          <!-- 卡牌由 JS 動態渲染 -->
        </div>
      </div>

    </section>
  </main>

  <footer class="text-center py-4 text-xs text-pink-400">
    🎀 雲端心電感應 App &bull; Sweet My Melody Style 🎀
  </footer>

  <script>
    // 1. 設定檔
    const SHEET_NAME = 'TelepathyData';
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzYa8Gq4uAyV4lVNr-z49NjbV73hAV5Q2MclEYhOvBYioupG8BNtrP2WvKNz3R-EeLI/exec";

    // 2. 狀態變數
    let currentRoom = "";
    let currentName = "";
    let isHost = false;
    let pollTimer = null;
    let localGameState = { status: "setup", question: "", answers: {} };
    let secretClickCount = 0;

    // 3. API 串接函式 (已修復 CORS 相關設定)
    async function apiGet(room) {
      try {
        const response = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(room)}`, {
          method: 'GET',
          redirect: 'follow'
        });
        if (!response.ok) throw new Error("Network error");
        return await response.json();
      } catch (err) {
        console.error("GET 失敗:", err);
        return null;
      }
    }

    async function apiPost(data) {
      try {
        // 避免在 headers 設定 custom content-type 觸發預檢 OPTIONS
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          redirect: 'follow',
          body: JSON.stringify(data)
        });
        return await response.json();
      } catch (err) {
        console.error("POST 失敗:", err);
        return null;
      }
    }

    // 4. 進入房間邏輯
    function joinRoom() {
      const roomInput = document.getElementById('inputRoom').value.trim();
      const nameInput = document.getElementById('inputName').value.trim();
      isHost = document.getElementById('isHostCheckbox').checked;

      if (!roomInput || !nameInput) {
        alert("請輸入房號與您的暱稱！");
        return;
      }

      currentRoom = roomInput;
      currentName = nameInput;

      // 更新 UI 狀態
      document.getElementById('displayRoom').innerText = `房號: ${currentRoom}`;
      document.getElementById('displayName').innerText = `玩家: ${currentName}`;
      document.getElementById('hostRoomLabel').innerText = currentRoom;
      document.getElementById('userInfoBar').classList.remove('hidden');

      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');

      updateHostConsoleVisibility();

      // 啟動輪詢機制 (每 2.5 秒輪詢一次)
      fetchGameState();
      pollTimer = setInterval(fetchGameState, 2500);
    }

    // 5. 隱藏房主開關邏輯
    function handleSecretClick() {
      secretClickCount++;
      if (secretClickCount >= 3) {
        toggleHostMode();
        secretClickCount = 0;
      }
    }

    function toggleHostMode() {
      isHost = !isHost;
      updateHostConsoleVisibility();
      alert(isHost ? "👑 已切換為【房主權限】" : "👤 已切換為【一般玩家權限】");
    }

    function updateHostConsoleVisibility() {
      const hostConsole = document.getElementById('hostConsole');
      if (isHost) {
        hostConsole.classList.remove('hidden');
      } else {
        hostConsole.classList.add('hidden');
      }
    }

    // 6. 遊戲狀態同步與輪詢
    async function fetchGameState() {
      if (!currentRoom) return;

      const data = await apiGet(currentRoom);
      if (!data) return;

      localGameState = data;
      renderGameScreen();
    }

    // 7. 畫面渲染
    function renderGameScreen() {
      const { status, question, answers } = localGameState;

      // 渲染題目
      const qDisplay = document.getElementById('questionDisplay');
      if (question) {
        qDisplay.innerText = `「 ${question} 」`;
      } else {
        qDisplay.innerText = "等待房主出題中... 💭";
      }

      // 渲染玩家填答區
      const answerSection = document.getElementById('answerSection');
      if (status === 'playing' || status === 'revealed') {
        answerSection.classList.remove('hidden');
      } else {
        answerSection.classList.add('hidden');
      }

      // 更新答案提交狀態提示
      const submitStatus = document.getElementById('submitStatus');
      if (answers && answers[currentName]) {
        submitStatus.innerText = `✅ 你已送出答案：「${answers[currentName]}」`;
      } else {
        submitStatus.innerText = "⏳ 請輸入答案並點擊送出...";
      }

      // 渲染 3D 翻牌卡牌陣列
      renderCards(answers || {}, status === 'revealed');
    }

    // 8. 渲染 3D 翻牌卡牌
    function renderCards(answers, isRevealed) {
      const grid = document.getElementById('cardsGrid');
      const playerNames = Object.keys(answers);
      
      document.getElementById('playerCountBadge').innerText = `${playerNames.length} 人參與`;

      if (playerNames.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-8 text-pink-300 font-bold">
            目前還沒有玩家加入填答～🌸
          </div>
        `;
        return;
      }

      grid.innerHTML = playerNames.map(name => {
        const answerText = answers[name];
        const hasAnswered = Boolean(answerText);

        return `
          <div class="perspective-1000 w-full h-44">
            <div class="card-inner relative w-full h-full duration-700 transform-style-3d transition-transform ${isRevealed ? 'rotate-y-180' : ''}">
              
              <!-- 🃏 卡牌正面 (蓋牌風格) -->
              <div class="absolute inset-0 w-full h-full bg-gradient-to-b from-pink-100 to-pink-200 border-4 border-pink-300 rounded-3xl flex flex-col items-center justify-center p-3 backface-hidden shadow-md">
                <div class="text-3xl mb-1">🎀</div>
                <div class="font-extrabold text-pink-700 text-base truncate max-w-full">${escapeHtml(name)}</div>
                <div class="mt-2 text-xs font-bold px-2.5 py-1 rounded-full ${hasAnswered ? 'bg-pink-400 text-white' : 'bg-white/60 text-pink-400'}">
                  ${hasAnswered ? '已完成 ✨' : '思考中... 💭'}
                </div>
              </div>

              <!-- 🃏 卡牌背面 (開牌後顯示答案) -->
              <div class="absolute inset-0 w-full h-full bg-white border-4 border-pink-400 rounded-3xl flex flex-col items-center justify-center p-4 backface-hidden rotate-y-180 shadow-lg">
                <span class="text-xs font-bold text-pink-400 mb-1">🎀 ${escapeHtml(name)} 的答案</span>
                <div class="text-xl font-extrabold text-pink-600 break-all text-center leading-snug">
                  ${escapeHtml(answerText || '無答案')}
                </div>
              </div>

            </div>
          </div>
        `;
      }).join('');
    }

    // 9. 房主與玩家動作控制
    async function setQuestion() {
      const qInput = document.getElementById('hostQuestionInput').value.trim();
      if (!qInput) {
        alert("請輸入題目內文！");
        return;
      }
      await apiPost({ room: currentRoom, action: "set_question", question: qInput });
      document.getElementById('hostQuestionInput').value = "";
      fetchGameState();
    }

    async function submitAnswer() {
      const ansInput = document.getElementById('playerAnswerInput').value.trim();
      if (!ansInput) {
        alert("答案不能為空！");
        return;
      }
      await apiPost({ room: currentRoom, action: "submit_answer", playerName: currentName, answer: ansInput });
      fetchGameState();
    }

    async function revealCards() {
      await apiPost({ room: currentRoom, action: "reveal" });
      fetchGameState();
    }

    async function resetGame() {
      if (confirm("確定要重置本局遊戲嗎？所有答案將會清空。")) {
        await apiPost({ room: currentRoom, action: "reset" });
        fetchGameState();
      }
    }

    // 防止 HTML 注入工具函式
    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
